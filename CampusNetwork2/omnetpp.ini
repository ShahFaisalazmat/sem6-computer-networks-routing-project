[General]
network = campusnetwork.CampusNetwork
sim-time-limit = 180s
record-eventlog = true
**.scalar-recording = true
**.vector-recording = true

# Let configurator auto-assign IPs and routes for all scenarios
*.configurator.assignAddresses = true
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# UDP enabled on all hosts
**.seHost*.hasUdp    = true
**.eeHost*.hasUdp    = true
**.bbaHost*.hasUdp   = true
**.adminHost*.hasUdp = true
**.appServer.hasUdp  = true

# App count
**.seHost*.numApps    = 1
**.eeHost*.numApps    = 1
**.bbaHost*.numApps   = 1
**.adminHost*.numApps = 1

# App type
**.seHost*.app[0].typename    = "campusnetwork.TrafficGen"
**.eeHost*.app[0].typename    = "campusnetwork.TrafficGen"
**.bbaHost*.app[0].typename   = "campusnetwork.TrafficGen"
**.adminHost*.app[0].typename = "campusnetwork.TrafficGen"

# Destination
**.seHost*.app[0].destAddress    = "appServer"
**.eeHost*.app[0].destAddress    = "appServer"
**.bbaHost*.app[0].destAddress   = "appServer"
**.adminHost*.app[0].destAddress = "appServer"

# Ports
**.seHost*.app[0].destPort    = 5000
**.eeHost*.app[0].destPort    = 5000
**.bbaHost*.app[0].destPort   = 5000
**.adminHost*.app[0].destPort = 5000
**.seHost*.app[0].localPort    = 4000
**.eeHost*.app[0].localPort    = 4000
**.bbaHost*.app[0].localPort   = 4000
**.adminHost*.app[0].localPort = 4000

# Packet size
**.seHost*.app[0].packetSize    = 512B
**.eeHost*.app[0].packetSize    = 512B
**.bbaHost*.app[0].packetSize   = 512B
**.adminHost*.app[0].packetSize = 512B

# Timing
**.seHost*.app[0].startTime    = 20s
**.eeHost*.app[0].startTime    = 20s
**.bbaHost*.app[0].startTime   = 20s
**.adminHost*.app[0].startTime = 20s
**.seHost*.app[0].stopTime    = 170s
**.eeHost*.app[0].stopTime    = 170s
**.bbaHost*.app[0].stopTime   = 170s
**.adminHost*.app[0].stopTime = 170s

# App server (receiver only)
**.appServer.numApps = 1
**.appServer.app[0].typename    = "campusnetwork.TrafficGen"
**.appServer.app[0].localPort   = 5000
**.appServer.app[0].destAddress = ""
**.appServer.app[0].startTime   = 200s
**.appServer.app[0].stopTime    = 200s

**.dnsServer.numApps = 0
*.linkController.enabled = true

# -----------------------------------------------------------------------
# 1. STATIC ROUTING — CBR
# -----------------------------------------------------------------------
[Config Static_CBR]
description = "Static Routing with CBR Traffic"
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
**.seHost*.app[0].trafficMode    = "cbr"
**.seHost*.app[0].sendInterval   = 0.1s
**.eeHost*.app[0].trafficMode    = "cbr"
**.eeHost*.app[0].sendInterval   = 0.1s
**.bbaHost*.app[0].trafficMode   = "cbr"
**.bbaHost*.app[0].sendInterval  = 0.1s
**.adminHost*.app[0].trafficMode  = "cbr"
**.adminHost*.app[0].sendInterval = 0.1s

# -----------------------------------------------------------------------
# 2. STATIC ROUTING — Bursty
# -----------------------------------------------------------------------
[Config Static_Bursty]
description = "Static Routing with Bursty Traffic"
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
**.seHost*.app[0].trafficMode   = "bursty"
**.seHost*.app[0].burstSize     = 10
**.seHost*.app[0].burstGap      = 1s
**.eeHost*.app[0].trafficMode   = "bursty"
**.eeHost*.app[0].burstSize     = 10
**.eeHost*.app[0].burstGap      = 1s
**.bbaHost*.app[0].trafficMode  = "bursty"
**.bbaHost*.app[0].burstSize    = 10
**.bbaHost*.app[0].burstGap     = 1s
**.adminHost*.app[0].trafficMode = "bursty"
**.adminHost*.app[0].burstSize   = 10
**.adminHost*.app[0].burstGap    = 1s

# -----------------------------------------------------------------------
# 3. RIP ROUTING — CBR
# -----------------------------------------------------------------------
[Config RIP_CBR]
description = "RIP Dynamic Routing with CBR Traffic"
**.hasRip = true
**.rip.updateInterval    = 30s
**.rip.routeExpiryTime   = 180s
**.rip.routeDeletionTime = 120s
**.rip.splitHorizon      = true
**.seHost*.app[0].trafficMode    = "cbr"
**.seHost*.app[0].sendInterval   = 0.1s
**.eeHost*.app[0].trafficMode    = "cbr"
**.eeHost*.app[0].sendInterval   = 0.1s
**.bbaHost*.app[0].trafficMode   = "cbr"
**.bbaHost*.app[0].sendInterval  = 0.1s
**.adminHost*.app[0].trafficMode  = "cbr"
**.adminHost*.app[0].sendInterval = 0.1s

# -----------------------------------------------------------------------
# 4. RIP ROUTING — Bursty
# -----------------------------------------------------------------------
[Config RIP_Bursty]
description = "RIP Dynamic Routing with Bursty Traffic"
**.hasRip = true
**.rip.updateInterval    = 30s
**.rip.routeExpiryTime   = 180s
**.rip.routeDeletionTime = 120s
**.rip.splitHorizon      = true
**.seHost*.app[0].trafficMode   = "bursty"
**.seHost*.app[0].burstSize     = 10
**.seHost*.app[0].burstGap      = 1s
**.eeHost*.app[0].trafficMode   = "bursty"
**.eeHost*.app[0].burstSize     = 10
**.eeHost*.app[0].burstGap      = 1s
**.bbaHost*.app[0].trafficMode  = "bursty"
**.bbaHost*.app[0].burstSize    = 10
**.bbaHost*.app[0].burstGap     = 1s
**.adminHost*.app[0].trafficMode = "bursty"
**.adminHost*.app[0].burstSize   = 10
**.adminHost*.app[0].burstGap    = 1s

# -----------------------------------------------------------------------
# 5. OSPF ROUTING — CBR
# -----------------------------------------------------------------------
[Config OSPF_CBR]
description = "OSPF Dynamic Routing with CBR Traffic"
**.hasOspf = true
**.ospf.helloInterval = 10s
**.ospf.deadInterval  = 40s
**.seHost*.app[0].trafficMode    = "cbr"
**.seHost*.app[0].sendInterval   = 0.1s
**.eeHost*.app[0].trafficMode    = "cbr"
**.eeHost*.app[0].sendInterval   = 0.1s
**.bbaHost*.app[0].trafficMode   = "cbr"
**.bbaHost*.app[0].sendInterval  = 0.1s
**.adminHost*.app[0].trafficMode  = "cbr"
**.adminHost*.app[0].sendInterval = 0.1s

# -----------------------------------------------------------------------
# 6. OSPF ROUTING — Bursty
# -----------------------------------------------------------------------
[Config OSPF_Bursty]
description = "OSPF Dynamic Routing with Bursty Traffic"
**.hasOspf = true
**.ospf.helloInterval = 10s
**.ospf.deadInterval  = 40s
**.seHost*.app[0].trafficMode   = "bursty"
**.seHost*.app[0].burstSize     = 10
**.seHost*.app[0].burstGap      = 1s
**.eeHost*.app[0].trafficMode   = "bursty"
**.eeHost*.app[0].burstSize     = 10
**.eeHost*.app[0].burstGap      = 1s
**.bbaHost*.app[0].trafficMode  = "bursty"
**.bbaHost*.app[0].burstSize    = 10
**.bbaHost*.app[0].burstGap     = 1s
**.adminHost*.app[0].trafficMode = "bursty"
**.adminHost*.app[0].burstSize   = 10
**.adminHost*.app[0].burstGap    = 1s
